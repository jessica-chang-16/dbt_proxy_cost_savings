#add columns, descriptions, tests
version: 2

models:
  - name: int_average_exchange_rate
    description: This model will join the exchange rates of the different countries along with the proxy request amounts to determine exchange rate and cost per region for each crawl session.
    columns:
      - name: month
        data_type: string
        description: The month the proxy requests were made, carried over from the proxy request data.
        data_tests:
          - not_null

      - name: brand
        data_type: string
        description: The retailer brand associated with the proxy requests.
        data_tests:
          - not_null

      - name: country
        data_type: string
        description: The country the proxy cost is being converted into local currency for, matched via region abbreviation.

      - name: cost_country
        data_type: float64
        description: The USD proxy cost converted into local currency, using the average exchange rate for that country.
        data_tests:
          - not_null

      - name: currency
        data_type: string
        description: The local currency code that the proxy cost has been converted into.

      - name: cost_usd
        data_type: float64
        description: The original proxy cost in USD, rounded to two decimal places, before currency conversion.
        data_tests:
          - not_null