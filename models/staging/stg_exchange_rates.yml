version: 2

sources: 
  - name: api_exchange_rates
    description: >
      This is the raw data file for the exchange rate currencies by country that was ingested via a python script called to an API.
    database: cost-savings-tl
    schema: analytics
    tables:
      - name: exchange_rates

models:
  - name: stg_exchange_rates
    description: This model renames and stages the raw exchange rate data ingested from the US Treasury API, one row per country/currency exchange rate.
    columns:
      - name: country
        data_type: string
        description: The country the exchange rate applies to.
        data_tests:
          - not_null
          - unique

      - name: exchange_rate
        data_type: float64
        description: The exchange rate for converting USD to the country's local currency, renamed from the misspelled source column `exchange_rage`.
        data_tests:
          - not_null

      - name: currency
        data_type: string
        description: The local currency code the exchange rate is quoted in.
      
