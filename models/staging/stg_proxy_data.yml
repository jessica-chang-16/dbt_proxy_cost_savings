version: 2

sources:
  - name: google_sheets_raw_proxy
    description: >
      This is the raw data file containing retailer and proxy information. If tested in this yml file, it will test the raw data straight from bigquery before staging layer.
    database: cost-savings-tl
    schema: analytics
    tables:
      - name: proxy_raw_data

models:
  - name: stg_proxy_data
    description: This model renames and stages the raw proxy usage data, one row per retailer brand/proxy record, dropping rows with a missing proxy value.
    columns:
      - name: brand
        data_type: string
        description: The retailer brand, renamed from the source `Slug` column.
        data_tests:
          - not_null
          - unique

      - name: proxy
        data_type: string
        description: The proxy used for the retailer, renamed from `Proxy_request_all`. Rows where this is `#N/A` are filtered out.
        data_tests:
          - not_null

      - name: region
        data_type: string
        description: The region associated with the retailer, defaulted to 'unassigned' when missing from the source.

      - name: whitelisted
        data_type: boolean
        description: Whether the retailer brand/region is already whitelisted, carried over as-is from the source.