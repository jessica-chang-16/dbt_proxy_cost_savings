version: 2

sources:
  - name: google_sheets_raw_clients
    description: >
      raw data file containing the retailer information and whether it is whitelisted or not.
    database: cost-savings-tl
    schema: analytics
    tables:
      - name: raw_client_data

models:
  - name: stg_whitelisting_data
    description: Cleaned and standardized client whitelisting data
    columns:
      - name: retailer
        data_type: string
        description: The retailer's company name, renamed from `Company_name`.

      - name: brand
        data_type: string
        description: The brand portion of the slug, split out from `Slug` before the '-' delimiter.

      - name: region_abv
        data_type: string
        description: The region abbreviation portion of the slug, split out from `Slug` after the '-' delimiter.

      - name: brand_region
        data_type: string
        description: The brand and region related to specific retailer.
        data_tests:
          - not_null

      - name: whitelisted
        data_type: boolean
        description: Tells whether or not the specific brand and region is whitelisted or not.
        data_tests:
          - not_null